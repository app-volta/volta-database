services:
  mongo:
    image: mongo:8.0
    container_name: volta-mongo
    restart: unless-stopped

    ports:
      - "${MONGO_PORT:-27018}:27017"

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}

    volumes:
      - volta_mongo_data:/data/db
      - ./scripts/mongodb/init-chat.js:/docker-entrypoint-initdb.d/init-chat.js:ro

volumes:
  volta_mongo_data: